<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup Page</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #9d50bb, #6e48aa, #fbc2eb);
    }

    .signup-box {
      background: rgba(255,255,255,0.95);
      padding: 45px 35px;
      border-radius: 20px;
      width: 380px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
    }

    .signup-box h2 {
      color: #880e4f;
      margin-bottom: 25px;
      font-size: 28px;
      font-weight: bold;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #880e4f;
      box-shadow: 0 0 0 3px rgba(136, 14, 79, 0.2);
    }

    .signup-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(to right, #880e4f, #ad1457);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .signup-btn:hover {
      background: linear-gradient(to right, #ad1457, #d81b60);
    }

    .or-divider {
      margin: 20px 0;
      text-align: center;
      font-size: 14px;
      color: #aaa;
      position: relative;
    }

    .or-divider::before,
    .or-divider::after {
      content: '';
      height: 1px;
      width: 40%;
      background-color: #ddd;
      position: absolute;
      top: 50%;
    }

    .or-divider::before { left: 0; }
    .or-divider::after { right: 0; }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background-color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: 0.3s;
    }

    .google-btn:hover {
      background-color: #f5f5f5;
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
      margin-right: 10px;
    }

    .login-link {
      margin-top: 18px;
      font-size: 14px;
      color: #555;
    }

    .login-link a {
      color: #880e4f;
      font-weight: bold;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="signup-box">
    <h2>Create Account</h2>

    <form action="signup.php" method="post">

      <div class="input-group">
        <label>Name</label>
        <input type="text" name="name" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>

      <button type="submit" class="signup-btn">Sign Up</button>

      

      <div class="login-link">
        Already have an account? <a href="login.html">Login</a>
      </div>

    </form>
  </div>

  <script>
    function googleSignup() {
      alert("Google signup not connected yet");
    }
  </script>

</body>
</html>
