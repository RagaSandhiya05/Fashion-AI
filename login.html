<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Animated Gradient Background */
      background: linear-gradient(135deg, #9d50bb, #6e48aa, #fbc2eb);
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .login-box {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      width: 380px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .login-box h2 {
      color: #880e4f;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: bold;
    }

    .input-group {
      position: relative;
      margin-bottom: 25px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 12px 40px 12px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #880e4f;
      box-shadow: 0 0 0 3px rgba(136, 14, 79, 0.2);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 38px;
      cursor: pointer;
      font-size: 18px;
      color: #880e4f;
      user-select: none;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(to right, #880e4f, #ad1457);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      background: linear-gradient(to right, #ad1457, #d81b60);
    }

    .or-divider {
      margin: 20px 0;
      text-align: center;
      font-size: 14px;
      color: #aaa;
      position: relative;
    }

    .or-divider::before,
    .or-divider::after {
      content: '';
      height: 1px;
      width: 40%;
      background-color: #ddd;
      position: absolute;
      top: 50%;
    }

    .or-divider::before { left: 0; }
    .or-divider::after { right: 0; }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background-color: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: 0.3s;
    }

    .google-btn:hover {
      background-color: #f5f5f5;
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
      margin-right: 10px;
    }

    .signup-link {
      margin-top: 18px;
      font-size: 14px;
      color: #555;
    }

    .signup-link a {
      color: #880e4f;
      font-weight: bold;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h2>Login</h2>

    <form action="login.php" method="post">
      <div class="input-group">
        <label for="username">Email</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <span class="toggle-password" onclick="togglePassword()">👁️</span>
      </div>

      <button type="submit" class="login-btn">Login</button>

      

      <div class="signup-link">
        Don’t have an account? <a href="signup.html">Sign up</a>
      </div>
    </form>
  </div>

  <script>
    function togglePassword() {
      const pwd = document.getElementById("password");
      pwd.type = (pwd.type === "password") ? "text" : "password";
    }

    function googleLogin() {
      window.location.href = "https://accounts.google.com/signin";
    }
  </script>
</body>
</html>
