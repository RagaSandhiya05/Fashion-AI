<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Successful</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e8,#ff9acb);
    font-family:'Segoe UI',sans-serif;
    padding:20px;
}

/* Card */
.success-card{
    background:#fff;
    width:100%;
    max-width:420px;
    padding:45px 35px;
    border-radius:28px;
    box-shadow:0 25px 60px rgba(0,0,0,0.25);
    text-align:center;
    animation:fadeUp 0.6s ease;
}

/* Icon */
.check-circle{
    width:90px;
    height:90px;
    margin:0 auto 20px;
    border-radius:50%;
    background:linear-gradient(45deg,#d81b60,#ff4081);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:48px;
    box-shadow:0 10px 30px rgba(216,27,96,0.5);
}

/* Text */
.success-card h1{
    color:#d81b60;
    font-size:28px;
    margin-bottom:10px;
}

.success-card p{
    color:#555;
    font-size:16px;
    line-height:1.6;
    margin-bottom:30px;
}

/* Buttons */
.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:25px;
    background:linear-gradient(45deg,#d81b60,#ff4081);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(216,27,96,0.45);
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

/* Animation */
@keyframes fadeUp{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
}

/* Mobile */
@media(max-width:480px){
    .success-card{
        padding:35px 25px;
        border-radius:22px;
    }
    .success-card h1{
        font-size:24px;
    }
    .check-circle{
        width:80px;
        height:80px;
        font-size:42px;
    }
}

/* Tablet */
@media(min-width:481px) and (max-width:768px){
    .success-card{
        max-width:480px;
    }
}
</style>
</head>

<body>

<div class="success-card">
    <div class="check-circle">✓</div>

    <h1>Payment Successful</h1>
    <p>
        Your payment has been completed successfully 💖 <br>
        We are now preparing your custom outfit.
    </p>

    <button class="btn" onclick="goHome()">Continue Shopping</button>
</div>

<script>
function goHome(){
    window.location.href = "index.html"; // change if needed
}
</script>

</body>
</html>
