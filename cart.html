<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fdfdfd;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .cart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f8f8f8;
      font-weight: bold;
    }

    img {
      width: 60px;
      border-radius: 6px;
    }

    input[type="number"] {
      width: 60px;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .total {
      text-align: right;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .checkout-btn {
      margin-top: 20px;
      float: right;
      padding: 10px 20px;
      background-color: #f06292;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background-color: #ec407a;
    }
  </style>
</head>
<body>

  <h1>🛒 Your Shopping Cart</h1>

  <div class="cart-container">
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Title</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody id="cart-items">
        <tr>
          <td><img src="images1.jpeg" alt="Dress 1" /></td>
          <td>Aqua Blossom Flair</td>
          <td>700</td>
          <td><input type="number" value="1" min="1" onchange="updateTotal()"></td>
          <td class="subtotal">700</td>
        </tr>
        <tr>
          <td><img src="dress4.jpeg" alt="Dress 4" /></td>
          <td>Pink Party Dress</td>
          <td>1249</td>
          <td><input type="number" value="1" min="1" onchange="updateTotal()"></td>
          <td class="subtotal">1249</td>
        </tr>
        <tr>
          <td><img src="dress6.jpeg" alt="Dress 4" /></td>
          <td>Celeste Grace Gown</td>
          <td>1000</td>
          <td><input type="number" value="1" min="1" onchange="updateTotal()"></td>
          <td class="subtotal">1000</td>
        </tr>
        <tr>
          <td><img src="dress5.jpeg" alt="Dress 4" /></td>
          <td>Royal Petal Elegance</td>
          <td>2000</td>
          <td><input type="number" value="1" min="1" onchange="updateTotal()"></td>
          <td class="subtotal">2000</td>
        </tr>
      </tbody>
    </table>

    <div class="total">
      Total: ₹<span id="total-amount">1788</span>
    </div>

    <button class="checkout-btn">Proceed to Checkout</button>
  </div>

  <script>
    function updateTotal() {
      let rows = document.querySelectorAll("#cart-items tr");
      let total = 0;

      rows.forEach(row => {
        const price = parseFloat(row.cells[2].textContent);
        const qty = parseInt(row.querySelector("input").value);
        const subtotal = price * qty;
        row.querySelector(".subtotal").textContent = subtotal;
        total += subtotal;
      });

      document.getElementById("total-amount").textContent = total;
    }
  </script>

</body>
</html>
